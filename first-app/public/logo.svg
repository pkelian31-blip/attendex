<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="white" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Books stack (left) -->
  <rect x="40" y="180" width="70" height="14" rx="3" fill="#ef4444"/>
  <rect x="38" y="194" width="72" height="14" rx="3" fill="#f59e0b"/>
  <rect x="36" y="208" width="74" height="14" rx="3" fill="#10b981"/>
  <rect x="42" y="176" width="10" height="4" rx="1" fill="#dc2626"/>

  <!-- Apple (center-left) -->
  <circle cx="175" cy="240" r="28" fill="#ef4444"/>
  <ellipse cx="175" cy="215" rx="4" ry="8" fill="#10b981"/>
  <ellipse cx="182" cy="213" rx="8" ry="5" fill="#10b981"/>
  <circle cx="165" cy="232" r="5" fill="#fca5a5" opacity="0.5"/>

  <!-- Pencil (bottom) -->
  <rect x="60" y="330" width="260" height="18" rx="4" fill="#f59e0b"/>
  <polygon points="60,330 60,348 40,339" fill="#9ca3af"/>
  <rect x="300" y="330" width="20" height="18" rx="0" fill="#ef4444"/>
  <rect x="316" y="330" width="8" height="18" rx="0" fill="#1f2937"/>
  <line x1="60" y1="336" x2="320" y2="336" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="60" y1="342" x2="320" y2="342" stroke="white" stroke-width="1.5" opacity="0.4"/>

  <!-- Ladybug (top) -->
  <circle cx="200" cy="42" r="10" fill="#ef4444"/>
  <circle cx="200" cy="42" r="10" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="200" y1="32" x2="200" y2="52" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="195" cy="38" r="2" fill="#1f2937"/>
  <circle cx="205" cy="38" r="2" fill="#1f2937"/>
  <circle cx="195" cy="46" r="2" fill="#1f2937"/>
  <circle cx="205" cy="46" r="2" fill="#1f2937"/>

  <!-- Checkmark (right) -->
  <polyline points="310,155 325,175 355,140" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main text: ATTEND -->
  <text x="200" y="115" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    <tspan fill="#f97316">A</tspan><tspan fill="#3b82f6">T</tspan><tspan fill="#10b981">T</tspan><tspan fill="#ef4444">E</tspan><tspan fill="#f59e0b">N</tspan><tspan fill="#8b5cf6">D</tspan>
  </text>

  <!-- Cursive "me" style: X PRO -->
  <text x="200" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-style="italic" font-weight="bold" fill="#1f2937">X</text>
  <text x="248" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#3b82f6">PRO</text>

  <!-- TO TAKE -->
  <text x="200" y="215" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="#fef3c7" stroke="#1f2937" stroke-width="2" paint-order="stroke">
    ATTENDANCE
  </text>

  <!-- attendance subtitle -->
  <text x="200" y="295" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="22" fill="#f87171" stroke="#1f2937" stroke-width="1.5" paint-order="stroke">
    Smart Platform
  </text>

  <!-- KЭL PHANTOM signature -->
  <text x="200" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#6b7280">
    by KЭL ♛ PHANTOM
  </text>
</svg>
